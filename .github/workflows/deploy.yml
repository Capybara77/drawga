name: Deploy to Server

on:
  push:
    branches:
      - to-vue

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Репозиторий проверен

    - name: Login to server via SSH with password and deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          # Удаляем старый контейнер
          docker rm drawga -f || true
          
          # Удаляем старый образ
          docker rmi drawga || true
          
          rm -r /home/drawga
          mkdir /home/drawga
          cd /home/drawga
          
          git clone https://github.com/Capybara77/drawga.git .
          git checkout to-vue
          
          docker builder prune -f
          docker build -t drawga .
          
          # Запускаем новый контейнер
          docker run -p --network drawga -d drawga
